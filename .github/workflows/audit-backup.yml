name: Audit Backup

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download audit CSV
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -e
          if [ -z "$BACKEND_URL" ]; then
            echo "Missing BACKEND_URL secret" >&2
            exit 1
          fi
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "Missing ADMIN_TOKEN secret" >&2
            exit 1
          fi

          BASE="$BACKEND_URL"
          BASE="${BASE%%\?*}"
          BASE="${BASE%/}"
          if [ "${BASE##*/}" = "health" ]; then
            BASE="${BASE%/health}"
          fi
          BASE="${BASE%/}"

          TS=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          OUT_TMP="/tmp/audit_${TS}.csv"
          LATEST_TMP="/tmp/audit_latest.csv"

          URL="${BASE}/admin/audit.csv?limit=5000"
          echo "Fetching $URL -> $OUT_TMP"
          HTTP_CODE=$(curl -sS --retry 6 --retry-all-errors --retry-delay 5 --max-time 60 \
            -H "x-admin-token: $ADMIN_TOKEN" \
            -o "$OUT_TMP" \
            -w "%{http_code}" \
            "$URL" || echo "000")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Failed to fetch audit CSV. HTTP $HTTP_CODE" >&2
            echo "Response body (if any):" >&2
            head -c 2000 "$OUT_TMP" 2>/dev/null || true
            echo "" >&2
            exit 1
          fi

          cp "$OUT_TMP" "$LATEST_TMP"

      - name: Commit to backup branch
        env:
          BRANCH: audit-backups
          BACKUP_PUSH_TOKEN: ${{ secrets.BACKUP_PUSH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TOKEN="$BACKUP_PUSH_TOKEN"
          if [ -z "$TOKEN" ]; then
            TOKEN="$GITHUB_TOKEN"
          fi
          if [ -n "$TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          git fetch origin "$BRANCH" || true

          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout --orphan "$BRANCH"
            git rm -rf . || true
          fi

          mkdir -p backups

          TS=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          cp -f /tmp/audit_latest.csv backups/audit_latest.csv
          cp -f /tmp/audit_latest.csv "backups/audit_${TS}.csv"

          git add backups/*.csv
          if [ -z "$(git status --porcelain backups)" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(audit): backup $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! git push -u origin "$BRANCH"; then
            echo "Push failed. If this is a 403, either:" >&2
            echo "- Set Repo Settings -> Actions -> Workflow permissions to 'Read and write', OR" >&2
            echo "- Add a PAT as secret BACKUP_PUSH_TOKEN (repo write access)." >&2
            exit 1
          fi
