name: Render Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /health
        run: |
          set -e
          URL="https://slides-backend-zokf.onrender.com/health"
          for i in 1 2 3; do
            echo "Ping attempt $i: $URL"
            if curl -fsS --max-time 20 "$URL" > /dev/null; then
              echo "OK"
              exit 0
            fi
            sleep 5
          done
          echo "Ping failed"
          exit 1
