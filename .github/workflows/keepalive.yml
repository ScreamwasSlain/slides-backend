name: Keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/keepalive.yml'

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend health
        run: |
          set -e
          URL="https://slides-backend-zokf.onrender.com/health"
          echo "Pinging $URL"
          curl -fsS --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 "$URL"
